<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" width="1000" height="505" role="img" aria-labelledby="t d">
<title id="t">Match scoring rubric</title>
<desc id="d">Animated bar chart of the 100-point match scoring rubric. Only roles scoring 65 or higher are included.</desc>
<style>text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }</style>
<rect width="1000" height="505" rx="18" fill="#0b1220"/>
<rect width="1000" height="4" fill="#000"/><rect y="4" width="1000" height="4" fill="#dd0000"/><rect y="8" width="1000" height="4" fill="#ffce00"/>
<text x="40" y="52" font-size="20" font-weight="700" fill="#e5e7eb">Match Scoring Rubric</text>
<text x="960" y="52" font-size="15" text-anchor="end" fill="#9ca3af">100 points total</text>
<text x="40" y="106" font-size="15" fill="#cbd5e1">Core Skill Match</text>
<rect x="300" y="84" width="480" height="30" rx="8" fill="#111c33"/>
<rect x="300" y="84" width="0" height="30" rx="8" fill="#22d3ee" fill-opacity=".85"><animate attributeName="width" values="0;480;480;0" keyTimes="0;0.14;0.92;1" dur="9s" begin="0.00s" repeatCount="indefinite"/></rect>
<text x="960" y="106" font-size="16" font-weight="700" text-anchor="end" fill="#22d3ee" opacity="0">30 pts<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.92;1" dur="9s" begin="0.00s" repeatCount="indefinite"/></text>
<text x="40" y="152" font-size="15" fill="#cbd5e1">Experience &amp; Project Fit</text>
<rect x="300" y="130" width="480" height="30" rx="8" fill="#111c33"/>
<rect x="300" y="130" width="0" height="30" rx="8" fill="#22d3ee" fill-opacity=".85"><animate attributeName="width" values="0;320;320;0" keyTimes="0;0.14;0.92;1" dur="9s" begin="0.25s" repeatCount="indefinite"/></rect>
<text x="960" y="152" font-size="16" font-weight="700" text-anchor="end" fill="#22d3ee" opacity="0">20 pts<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.92;1" dur="9s" begin="0.25s" repeatCount="indefinite"/></text>
<text x="40" y="198" font-size="15" fill="#cbd5e1">Education &amp; Certification</text>
<rect x="300" y="176" width="480" height="30" rx="8" fill="#111c33"/>
<rect x="300" y="176" width="0" height="30" rx="8" fill="#34d399" fill-opacity=".85"><animate attributeName="width" values="0;240;240;0" keyTimes="0;0.14;0.92;1" dur="9s" begin="0.50s" repeatCount="indefinite"/></rect>
<text x="960" y="198" font-size="16" font-weight="700" text-anchor="end" fill="#34d399" opacity="0">15 pts<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.92;1" dur="9s" begin="0.50s" repeatCount="indefinite"/></text>
<text x="40" y="244" font-size="15" fill="#cbd5e1">Junior / Entry-Level Fit</text>
<rect x="300" y="222" width="480" height="30" rx="8" fill="#111c33"/>
<rect x="300" y="222" width="0" height="30" rx="8" fill="#34d399" fill-opacity=".85"><animate attributeName="width" values="0;240;240;0" keyTimes="0;0.14;0.92;1" dur="9s" begin="0.75s" repeatCount="indefinite"/></rect>
<text x="960" y="244" font-size="16" font-weight="700" text-anchor="end" fill="#34d399" opacity="0">15 pts<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.92;1" dur="9s" begin="0.75s" repeatCount="indefinite"/></text>
<text x="40" y="290" font-size="15" fill="#cbd5e1">Onsite &amp; Location Fit</text>
<rect x="300" y="268" width="480" height="30" rx="8" fill="#111c33"/>
<rect x="300" y="268" width="0" height="30" rx="8" fill="#fbbf24" fill-opacity=".85"><animate attributeName="width" values="0;160;160;0" keyTimes="0;0.14;0.92;1" dur="9s" begin="1.00s" repeatCount="indefinite"/></rect>
<text x="960" y="290" font-size="16" font-weight="700" text-anchor="end" fill="#fbbf24" opacity="0">10 pts<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.92;1" dur="9s" begin="1.00s" repeatCount="indefinite"/></text>
<text x="40" y="336" font-size="15" fill="#cbd5e1">Language &amp; Work Auth</text>
<rect x="300" y="314" width="480" height="30" rx="8" fill="#111c33"/>
<rect x="300" y="314" width="0" height="30" rx="8" fill="#fbbf24" fill-opacity=".85"><animate attributeName="width" values="0;80;80;0" keyTimes="0;0.14;0.92;1" dur="9s" begin="1.25s" repeatCount="indefinite"/></rect>
<text x="960" y="336" font-size="16" font-weight="700" text-anchor="end" fill="#fbbf24" opacity="0">5 pts<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.92;1" dur="9s" begin="1.25s" repeatCount="indefinite"/></text>
<text x="40" y="382" font-size="15" fill="#cbd5e1">Hidden Market Strength</text>
<rect x="300" y="360" width="480" height="30" rx="8" fill="#111c33"/>
<rect x="300" y="360" width="0" height="30" rx="8" fill="#ffce00" fill-opacity=".85"><animate attributeName="width" values="0;80;80;0" keyTimes="0;0.14;0.92;1" dur="9s" begin="1.50s" repeatCount="indefinite"/></rect>
<text x="960" y="382" font-size="16" font-weight="700" text-anchor="end" fill="#ffce00" opacity="0">5 pts<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.92;1" dur="9s" begin="1.50s" repeatCount="indefinite"/></text>
<line x1="40" y1="408" x2="960" y2="408" stroke="#1f2937"/>
<text x="40" y="442" font-size="15" font-weight="700" fill="#e5e7eb">Total</text>
<rect x="300" y="420" width="600" height="30" rx="8" fill="#111c33"/>
<rect x="300" y="420" width="0" height="30" rx="8" fill="#ffce00" fill-opacity=".9"><animate attributeName="width" values="0;0;600;600;0" keyTimes="0;0.2;0.42;0.92;1" dur="9s" repeatCount="indefinite"/></rect>
<line x1="690" y1="412" x2="690" y2="458" stroke="#dd0000" stroke-width="3"><animate attributeName="stroke-opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></line>
<text x="690" y="478" font-size="14" font-weight="700" text-anchor="middle" fill="#fca5a5">65 = minimum to be included</text>
<text x="960" y="442" font-size="16" font-weight="700" text-anchor="end" fill="#ffce00">100</text>
</svg>
