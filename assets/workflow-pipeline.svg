<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="t d">
  <title id="t">Execution pipeline</title>
  <desc id="d">Animated seven-step pipeline: resume, profile extraction, bilingual role map, web research, verification, scoring, final report.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .flow { stroke-dasharray: 6 8; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .glow { opacity: 0; animation: glow 12.25s ease-in-out infinite; }
    @keyframes glow { 0% { opacity: 0; } 3% { opacity: 1; } 12% { opacity: 1; } 18% { opacity: 0; } 100% { opacity: 0; } }
  </style>

  <rect width="1200" height="240" rx="18" fill="#0b1220"/>
  <rect width="1200" height="4" fill="#000"/><rect y="4" width="1200" height="4" fill="#dd0000"/><rect y="8" width="1200" height="4" fill="#ffce00"/>

  <!-- connector -->
  <line class="flow" x1="120" y1="130" x2="1080" y2="130" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>

  <!-- nodes -->
  <g font-size="13" fill="#e5e7eb" text-anchor="middle">
    <g>
      <rect x="55" y="90" width="130" height="80" rx="14" fill="#111c33" stroke="#334155"/>
      <rect class="glow" style="animation-delay:-.3s" x="55" y="90" width="130" height="80" rx="14" fill="#22d3ee" fill-opacity=".18" stroke="#22d3ee" stroke-width="2"/>
      <text x="120" y="126">Candidate</text><text x="120" y="146" fill="#9ca3af">Resume / CV</text>
    </g>
    <g>
      <rect x="215" y="90" width="130" height="80" rx="14" fill="#111c33" stroke="#334155"/>
      <rect class="glow" style="animation-delay:1.45s" x="215" y="90" width="130" height="80" rx="14" fill="#22d3ee" fill-opacity=".18" stroke="#22d3ee" stroke-width="2"/>
      <text x="280" y="126">Extract Profile</text><text x="280" y="146" fill="#9ca3af">&amp; Skills</text>
    </g>
    <g>
      <rect x="375" y="90" width="130" height="80" rx="14" fill="#111c33" stroke="#334155"/>
      <rect class="glow" style="animation-delay:3.2s" x="375" y="90" width="130" height="80" rx="14" fill="#22d3ee" fill-opacity=".18" stroke="#22d3ee" stroke-width="2"/>
      <text x="440" y="126">Bilingual Role</text><text x="440" y="146" fill="#9ca3af">Map (DE / EN)</text>
    </g>
    <g>
      <rect x="535" y="90" width="130" height="80" rx="14" fill="#111c33" stroke="#334155"/>
      <rect class="glow" style="animation-delay:4.95s" x="535" y="90" width="130" height="80" rx="14" fill="#22d3ee" fill-opacity=".18" stroke="#22d3ee" stroke-width="2"/>
      <text x="600" y="126">Multi-Source</text><text x="600" y="146" fill="#9ca3af">Web Research</text>
    </g>
    <g>
      <rect x="695" y="90" width="130" height="80" rx="14" fill="#111c33" stroke="#334155"/>
      <rect class="glow" style="animation-delay:6.7s" x="695" y="90" width="130" height="80" rx="14" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2"/>
      <text x="760" y="126">Verification &amp;</text><text x="760" y="146" fill="#9ca3af">Onsite Check</text>
    </g>
    <g>
      <rect x="855" y="90" width="130" height="80" rx="14" fill="#111c33" stroke="#334155"/>
      <rect class="glow" style="animation-delay:8.45s" x="855" y="90" width="130" height="80" rx="14" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24" stroke-width="2"/>
      <text x="920" y="126">Score &amp; Filter</text><text x="920" y="146" fill="#9ca3af">min 65 / 100</text>
    </g>
    <g>
      <rect x="1015" y="90" width="130" height="80" rx="14" fill="#111c33" stroke="#334155"/>
      <rect class="glow" style="animation-delay:10.2s" x="1015" y="90" width="130" height="80" rx="14" fill="#ffce00" fill-opacity=".2" stroke="#ffce00" stroke-width="2"/>
      <text x="1080" y="126">Structured</text><text x="1080" y="146" fill="#9ca3af">Final Report</text>
    </g>
  </g>

  <!-- number badges -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#0b1220">
    <circle cx="120" cy="90" r="13" fill="#22d3ee"/><text x="120" y="95">1</text>
    <circle cx="280" cy="90" r="13" fill="#22d3ee"/><text x="280" y="95">2</text>
    <circle cx="440" cy="90" r="13" fill="#22d3ee"/><text x="440" y="95">3</text>
    <circle cx="600" cy="90" r="13" fill="#22d3ee"/><text x="600" y="95">4</text>
    <circle cx="760" cy="90" r="13" fill="#34d399"/><text x="760" y="95">5</text>
    <circle cx="920" cy="90" r="13" fill="#fbbf24"/><text x="920" y="95">6</text>
    <circle cx="1080" cy="90" r="13" fill="#ffce00"/><text x="1080" y="95">7</text>
  </g>

  <!-- travelling packet -->
  <g>
    <circle r="7" fill="#67e8f9"/>
    <circle r="14" fill="#67e8f9" fill-opacity=".25"/>
    <animateMotion dur="12.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.8571;1" path="M120,130 L1080,130"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.85;0.88;1" dur="12.25s" repeatCount="indefinite"/>
  </g>

  <text x="600" y="214" font-size="14" text-anchor="middle" fill="#6b7280" letter-spacing="1">RESUME → REPORT IN 7 AUTOMATED STEPS</text>
</svg>
